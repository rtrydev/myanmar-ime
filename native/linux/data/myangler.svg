<?xml version="1.0" encoding="UTF-8"?>
<!--
  Engine + launcher icon. The IBus panel and shell pick this up via
  the hicolor theme; libadwaita auto-recolours under dark mode.
  Displayed at 16, 24, 32, 48, 64, 128 px — vector keeps it crisp.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="#1a73e8"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Padauk, Pyidaungsu, Noto Sans Myanmar, sans-serif"
        font-size="40" fill="#ffffff" font-weight="700">က</text>
</svg>
